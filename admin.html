<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HHH Auto Draw</title><style>body{background:#111;color:#fff;font-family:sans-serif;padding:15px;text-align:center}textarea{width:95%;height:120px;border-radius:8px;padding:10px}button{padding:12px;width:95%;margin:5px;border:none;border-radius:8px;font-weight:bold;color:#fff} .g{background:#0a7d2e}.o{background:orange;color:#000}.b{background:#007bff} .box{background:#fff;color:#000;padding:10px;border-radius:10px;margin-top:10px;text-align:left;white-space:pre-wrap}</style></head><body><h2>HHH Auto Lottery</h2><div id="login"><input type="password" id="pass" placeholder="Password" style="padding:10px;width:80%"><br><br><button class="g" onclick="if(document.getElementById('pass').value==='3h123'){document.getElementById('panel').style.display='block';document.getElementById('login').style.display='none'}else{alert('Wrong')}">Login</button></div><div id="panel" style="display:none"><p>سارے نام یہاں پیسٹ کریں، ہر لائن پر ایک نام</p><textarea id="list" placeholder="Ali&#10;Ahmed&#10;Usman..."></textarea><br><button class="g" onclick="draw(1,'5000')">5000 کا 1 نام نکالو</button><button class="o" onclick="draw(2,'2500')">2500 کے 2 نام نکالو</button><button class="b" onclick="draw(100,'100')">100 والے 100 نام نکالو</button><div id="result" class="box">Result یہاں آئے گا...</div><button class="g" style="background:#333" onclick="saveWinners()">سارے ونر سیو کرو</button></div><script>let allWinners=[];function draw(count, prize){let names=document.getElementById('list').value.split('\n').filter(n=>n.trim()!='');if(names.length<count){alert('نام کم ہیں!');return}let shuffled=[...names].sort(()=>0.5-Math.random());let winners=shuffled.slice(0,count);let text=`--- ${prize} Rs Winners ---\n`+winners.join('\n')+'\n\n';document.getElementById('result').innerText+=text;allWinners.push(text);}function saveWinners(){localStorage.setItem('hhh_winners',document.getElementById('result').innerText);alert('Save Ho Gaya! Ab main site par dikhega');}</script></body></html>
