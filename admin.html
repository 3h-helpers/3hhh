<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Admin - Human Helping Hand</title>
</head>
<body>
<h2>Admin Panel - Human Helping Hand</h2>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="addUser()">Add Karo</button>
<button onclick="drawWinner()">Winner Nikalo</button>
<hr>
<div id="list">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDt-ledtqtU7illD-3gtKrX70nBf4ZsOgo",
  authDomain: "human-helping-hand.firebaseapp.com",
  databaseURL: "https://human-helping-hand-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "human-helping-hand",
  storageBucket: "human-helping-hand.firebasestorage.app",
  messagingSenderId: "291610402320",
  appId: "1:291610402320:web:4ad0bc85be37ba35877495",
  measurementId: "G-XT5CQHB47B"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.addUser = function(){
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  if(!name) return alert("Naam likho");
  push(ref(db, 'participants'), { name, phone, time: Date.now() });
  document.getElementById('name').value="";
  document.getElementById('phone').value="";
}
window.drawWinner = function(){
  onValue(ref(db, 'participants'), (snap)=>{
    const data = snap.val();
    if(!data) return alert("Koi user nahi");
    const keys = Object.keys(data);
    const winner = data[keys[Math.floor(Math.random()*keys.length)]];
    set(ref(db, 'winner'), winner);
    alert("Winner: "+winner.name);
  }, {onlyOnce:true});
}
onValue(ref(db, 'participants'), (snap)=>{
  const data = snap.val();
  let html = "<h3>Total: "+(data?Object.keys(data).length:0)+"</h3>";
  for(let k in data){ html += "<p>"+data[k].name+" - "+data[k].phone+"</p>"; }
  document.getElementById('list').innerHTML = html;
});
</script>
</body>
</html>
