<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HHH Auto</title><style>body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:15px}textarea{width:95%;height:150px;border-radius:10px;padding:10px}button{padding:12px;width:95%;margin:6px;border:none;border-radius:10px;font-weight:bold;font-size:16px}.g{background:green;color:#fff}.o{background:orange}.b{background:#007bff;color:#fff}.box{background:#fff;color:#000;padding:12px;border-radius:10px;margin-top:15px;white-space:pre-wrap;text-align:left}</style></head><body><h2>HHH Auto Lottery</h2><div id="L"><input id="p" type="password" placeholder="Password 3h123" style="padding:10px;width:80%"><br><br><button class="g" onclick="if(document.getElementById('p').value=='3h123'){document.getElementById('M').style.display='block';document.getElementById('L').style.display='none'}else{alert('Wrong Password')}">Login</button></div><div id="M" style="display:none"><p>سارے نام یہاں پیسٹ کرو، ہر لائن میں ایک نام</p><textarea id="list" placeholder="Ali&#10;Ahmed&#10;Bilal"></textarea><br><button class="g" onclick="draw(1,'5000')">5000 کا 1 نام نکالو</button><button class="o" onclick="draw(2,'2500')">2500 کے 2 نام نکالو</button><button class="b" onclick="draw(100,'100')">100 والے 100 نام نکالو</button><div id="res" class="box">Result...</div><button class="g" style="background:#222" onclick="localStorage.setItem('hhh_winners',document.getElementById('res').innerText);alert('Save Ho Gaya')">Save Karo</button></div><script>function draw(c,t){let n=document.getElementById('list').value.split('\n').filter(x=>x.trim()!='');if(n.length<c){alert('نام کم ہیں');return}let s=[...n].sort(()=>0.5-Math.random());let w=s.slice(0,c);let txt='--- '+t+' Rs Winners ---\n'+w.join('\n')+'\n\n';document.getElementById('res').innerText+=txt}</script></body></html>
